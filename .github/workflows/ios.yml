name: iOS Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate grammar resources
        run: python3 tools/validate_grammar.py

  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.app || true
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone" | head -20
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          c.sort(key=lambda t:t[0])
          print(c[-1][1]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project JapaneseGrammarScanner.xcodeproj \
            -scheme JapaneseGrammarScanner \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*JapaneseGrammarScanner|Test Case .* (passed|failed)|Executed|\*\* (TEST|BUILD)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log
      - name: Build for device (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project JapaneseGrammarScanner.xcodeproj \
            -scheme JapaneseGrammarScanner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
