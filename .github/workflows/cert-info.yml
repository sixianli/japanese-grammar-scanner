name: Certificate info for ICP filing
on:
  push:
    branches: [claude/project-thread-jjhz39]
    paths: [.github/workflows/cert-info.yml]
jobs:
  certs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, sys
          sys.path.insert(0, "tools")
          from appstore_listing import Api
          from cryptography import x509
          api = Api()
          import plistlib, re
          profiles = api.call("GET", "/profiles?limit=200")["data"]
          for p in profiles:
              a = p["attributes"]
              print(f"PROFILE {a.get('profileType')} | {a.get('name')} | {a.get('profileState')} | expires {a.get('expirationDate')}")
              content = a.get("profileContent")
              if not content:
                  print("  no content"); continue
              raw = base64.b64decode(content)
              m = re.search(rb"<\?xml.*?</plist>", raw, re.S)
              pl = plistlib.loads(m.group(0))
              print("  app id:", pl.get("Entitlements", {}).get("application-identifier"))
              for der in pl.get("DeveloperCertificates", []):
                  cert = x509.load_der_x509_certificate(der)
                  print("  CERT:", cert.subject.rfc4514_string(), "| until", cert.not_valid_after_utc.date())
                  print("    SHA1:", hashlib.sha1(der).hexdigest().upper())
                  print("    MODULUS:", format(cert.public_key().public_numbers().n, "X"))
          PY
