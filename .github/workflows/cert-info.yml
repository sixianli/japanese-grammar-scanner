name: Certificate info for ICP filing
on:
  push:
    branches: [claude/project-thread-jjhz39]
    paths: [.github/workflows/cert-info.yml]
jobs:
  certs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, sys
          sys.path.insert(0, "tools")
          from appstore_listing import Api
          from cryptography import x509
          api = Api()
          certs = api.call("GET", "/certificates?limit=200")["data"]
          for c in certs:
              a = c["attributes"]
              line = f"{a.get('certificateType')} | {a.get('displayName') or a.get('name')} | expires {a.get('expirationDate')} | platform {a.get('platform')}"
              content = a.get("certificateContent")
              if not content:
                  print(line, "| no content"); continue
              der = base64.b64decode(content)
              cert = x509.load_der_x509_certificate(der)
              n = cert.public_key().public_numbers().n
              print(line)
              print("  SHA1:", hashlib.sha1(der).hexdigest().upper())
              print("  MODULUS:", format(n, "X"))
          PY
