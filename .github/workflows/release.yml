name: Release to App Store Connect

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (MARKETING_VERSION)，如 1.4；不能低于 TestFlight 上已有的版本"
        required: true
        default: "1.4"
      dry_run:
        description: "只归档并检查，不上传"
        type: boolean
        default: false
      cloud_feedback:
        description: "强制打开 App 内反馈提交（测试用；正常由变量 CLOUD_FEEDBACK 控制）"
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography
      - name: Version must not be lower than TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
        run: python3 tools/require_version_not_lower.py "${{ inputs.version }}"

  upload:
    needs: version-check
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Check configuration
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID BUNDLE_ID; do
            if [ -z "${!v}" ]; then echo "::error::缺少配置 $v，请按 release.yml 顶部说明配置"; exit 1; fi
          done
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/require_ci_green.py "${{ github.repository }}" "${{ github.sha }}"
      - name: Validate data
        run: |
          python3 tools/validate_grammar.py
          python3 tools/validate_contrasts.py --release
          python3 tools/review_contrasts.py --check
          python3 tools/validate_compliance.py
          python3 tools/check_strings.py
      - name: App homepage privacy policy matches the app
        env:
          CLOUD_FEEDBACK: ${{ inputs.cloud_feedback && 'true' || vars.CLOUD_FEEDBACK }}
        run: python3 tools/privacy_mirror.py --check-live --cloud "${CLOUD_FEEDBACK:-false}"
      - name: Write API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Archive (unsigned; signed for App Store during export)
        env:
          CLOUD_FEEDBACK: ${{ inputs.cloud_feedback && 'true' || vars.CLOUD_FEEDBACK }}
        run: |
          set -o pipefail
          if [ "$CLOUD_FEEDBACK" = "true" ]; then
            SIGNING=(CODE_SIGN_ENTITLEMENTS=Config/CloudFeedback.entitlements
                     "SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited) CLOUD_FEEDBACK"
                     CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES
                     CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO PROVISIONING_PROFILE_SPECIFIER="")
          else
            SIGNING=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="")
          fi
          xcodebuild archive \
            -project JapaneseGrammarScanner.xcodeproj \
            -scheme JapaneseGrammarScanner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM=${{ vars.APPLE_TEAM_ID }} \
            PRODUCT_BUNDLE_IDENTIFIER=${{ vars.BUNDLE_ID }} \
            MARKETING_VERSION=${{ inputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${SIGNING[@]}" \
            | tail -20
          if [ "$CLOUD_FEEDBACK" = "true" ]; then
            ENT=$(codesign -d --entitlements - build/App.xcarchive/Products/Applications/*.app 2>&1 || true)
            echo "$ENT"
            echo "$ENT" | grep -q "iCloud.${{ vars.BUNDLE_ID }}" || { echo "::error::归档中没有 iCloud 权限，停止上传（否则提交反馈会闪退）"; exit 1; }
          fi
      - name: Stop here (dry run)
        if: inputs.dry_run
        run: echo "dry run：只检查归档，不上传。"
      - name: Upload to App Store Connect
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ vars.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -40
          echo "✅ 已上传，约 10–30 分钟后可在 App Store Connect → TestFlight 中看到构建版本。"
