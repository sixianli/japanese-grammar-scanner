# 一键打包并上传到 App Store Connect（TestFlight → 提交审核）。
#
# 需要先在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置：
#   Secrets:
#     ASC_KEY_ID          App Store Connect API Key 的 Key ID
#     ASC_ISSUER_ID       App Store Connect API 的 Issuer ID
#     ASC_KEY_P8          API Key 文件（AuthKey_XXXX.p8）的完整文本内容
#   Variables:
#     APPLE_TEAM_ID       Apple Developer Team ID（10 位）
#     BUNDLE_ID           在 App Store Connect 中创建 App 时使用的 Bundle ID
#     CLOUD_FEEDBACK      设为 true 后启用 App 内反馈提交（iCloud / CloudKit），见 docs/feedback/SETUP.md
# API Key 需在 App Store Connect → 用户和访问 → 集成 → App Store Connect API 中创建，角色选 “App 管理”。
name: Release to App Store Connect

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (MARKETING_VERSION)，如 1.0"
        required: true
        default: "1.0"
      dry_run:
        description: "只归档并检查，不上传"
        type: boolean
        default: false
      cloud_feedback:
        description: "强制打开 App 内反馈提交（测试用；正常由变量 CLOUD_FEEDBACK 控制）"
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

jobs:
  upload:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Check configuration
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID BUNDLE_ID; do
            if [ -z "${!v}" ]; then echo "::error::缺少配置 $v，请按 release.yml 顶部说明配置"; exit 1; fi
          done
      - name: Require green CI for this commit
        # 硬门槛（CLAUDE.md）：同一个提交的数据校验、单元测试、端到端测试没有全部跑完并通过，不能打包上传
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/require_ci_green.py "${{ github.repository }}" "${{ github.sha }}"
      - name: Validate data
        run: |
          python3 tools/validate_grammar.py
          python3 tools/validate_contrasts.py
          python3 tools/validate_compliance.py
          python3 tools/check_strings.py
      - name: Write API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Archive (unsigned; signed for App Store during export)
        env:
          # 打开后编译 App 内反馈提交（CloudKit），并给 App 加上 iCloud 能力；配置方法见 docs/feedback/SETUP.md
          CLOUD_FEEDBACK: ${{ inputs.cloud_feedback && 'true' || vars.CLOUD_FEEDBACK }}
        run: |
          set -o pipefail
          if [ "$CLOUD_FEEDBACK" = "true" ]; then
            # 带 iCloud 权限做临时签名，导出时由 App Store 签名保留这些权限
            SIGNING=(CODE_SIGN_ENTITLEMENTS=Config/CloudFeedback.entitlements
                     "SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited) CLOUD_FEEDBACK"
                     CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES
                     CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO PROVISIONING_PROFILE_SPECIFIER="")
          else
            SIGNING=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="")
          fi
          xcodebuild archive \
            -project JapaneseGrammarScanner.xcodeproj \
            -scheme JapaneseGrammarScanner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM=${{ vars.APPLE_TEAM_ID }} \
            PRODUCT_BUNDLE_IDENTIFIER=${{ vars.BUNDLE_ID }} \
            MARKETING_VERSION=${{ inputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${SIGNING[@]}" \
            | tail -20
          if [ "$CLOUD_FEEDBACK" = "true" ]; then
            ENT=$(codesign -d --entitlements - build/App.xcarchive/Products/Applications/*.app 2>&1 || true)
            echo "$ENT"
            echo "$ENT" | grep -q "iCloud.${{ vars.BUNDLE_ID }}" || { echo "::error::归档中没有 iCloud 权限，停止上传（否则提交反馈会闪退）"; exit 1; }
          fi
      - name: Stop here (dry run)
        if: inputs.dry_run
        run: echo "dry run：只检查归档，不上传。"
      - name: Upload to App Store Connect
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ vars.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -40
          echo "✅ 已上传，约 10–30 分钟后可在 App Store Connect → TestFlight 中看到构建版本。"
