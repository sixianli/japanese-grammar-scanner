# 备用：如果 Xcode 版本低于 16 无法打开 JapaneseGrammarScanner.xcodeproj，
# 可用 XcodeGen 重新生成：brew install xcodegen && xcodegen generate
name: JapaneseGrammarScanner
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  JapaneseGrammarScanner:
    type: application
    platform: iOS
    sources:
      - path: JapaneseGrammarScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.JapaneseGrammarScanner
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: 日语语法速查
        INFOPLIST_KEY_NSCameraUsageDescription: 需要使用相机扫描书本上的日文，以识别其中的语法点。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
